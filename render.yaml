# Blueprint do Render: API .NET no plano gratuito.
# Usa o mesmo servidor PostgreSQL gratuito da API Java, num banco separado (bico_certo_net).
# Os valores marcados com sync: false sao pedidos pelo Render na criacao (nao ficam no Git).
services:
  - type: web
    name: bico-certo-dotnet
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./dockerfiles/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: JavaApi__BaseUrl
        value: https://bico-certo-api.onrender.com
      - key: JavaApi__TimeoutSegundos
        value: "60"
